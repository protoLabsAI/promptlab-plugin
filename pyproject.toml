[project]
name = "promptlab-plugin"
version = "0.1.1"
description = "Prompt manager + playground plugin for protoAgent (versioned prompt store, streaming playground view, agent tools)."
requires-python = ">=3.11"

# Runtime deps come from the protoAgent host (langchain-core, fastapi, pyyaml) —
# this plugin adds none, so the manifest's requires_pip is empty.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E501", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
