name: CI

# Lint + test the plugin, and prove the frontend builds. Runs on a GitHub-hosted runner
# (ubuntu-latest).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev deps
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build (type-check + bundle)
        working-directory: frontend
        run: npm ci && npm run build

      - name: Test
        working-directory: frontend
        run: npm test
